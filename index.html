<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lampa — фильмы, сериалы и ТВ-шоу</title>

    <meta name="description" content="Lampa для фильмов, сериалов и раздела ТВ-шоу." />

    <meta property="og:title" content="Lampa — фильмы, сериалы и ТВ-шоу">
    <meta property="og:description" content="Lampa для фильмов, сериалов и раздела ТВ-шоу.">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image" content="og.png">

    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="manifest" href="icons/site.webmanifest" crossorigin="use-credentials">
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="shortcut icon" href="icons/favicon.ico">
    <meta name="msapplication-TileColor" content="#1d1f20">
    <meta name="msapplication-config" content="icons/browserconfig.xml">
    <meta name="theme-color" content="#1d1f20">

    <meta name="referrer" content="never">

    <link rel="stylesheet" href="./vender/scrollbar/jquery.scrollbar.css">
    <link rel="stylesheet" href="./vender/keypad/style.css">
    <link rel="stylesheet" href="css/app.css?v=4.56">
    <style>
        .tv-shows-panel {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: #1d1f20;
            overflow: auto;
            padding: 5vh 5vw;
            box-sizing: border-box;
        }
        .tv-shows-panel.is-visible { display: block; }
        .tv-shows-panel__inner { max-width: 1200px; margin: 0 auto; }
        .tv-shows-panel__header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
        .tv-shows-panel__title { font-size: 34px; font-weight: 600; }
        .tv-shows-panel__hint { opacity:.65; margin-top:6px; }
        .tv-shows-panel__close { cursor:pointer; padding:12px 18px; border-radius:8px; background:rgba(255,255,255,.08); }
        .tv-shows-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
        .tv-show-card { padding:18px; border-radius:12px; background:rgba(255,255,255,.06); cursor:pointer; }
        .tv-show-card__name { font-size:21px; font-weight:600; }
        .tv-show-card__status { margin-top:8px; opacity:.6; font-size:14px; }
        .tv-show-empty { opacity:.6; padding:30px 0; }
    </style>
</head>
<body style="background: #1d1f20;">
    <script>
        window.youtube_lazy_load = true
    </script>

    <div class="welcome"></div>

    <div id="app"></div>

    <div id="tv-shows-panel" class="tv-shows-panel" aria-hidden="true">
        <div class="tv-shows-panel__inner">
            <div class="tv-shows-panel__header">
                <div>
                    <div class="tv-shows-panel__title">ТВ-шоу</div>
                    <div class="tv-shows-panel__hint">Телепередачи по телеканалам. Выпуск открывается через существующий торрент-поток Lampa/TorrServer.</div>
                </div>
                <div id="tv-shows-close" class="tv-shows-panel__close" tabindex="0">Закрыть</div>
            </div>
            <div id="tv-shows-grid" class="tv-shows-grid"></div>
        </div>
    </div>

    <div class="no-network hide">
        <div class="no-network__title">Ошибка</div>
        <div class="no-network__desc">Не удалось загрузить файл: <span class="no-network__file"></span></div>
    </div>

    <script src="./webos/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>
    <script src="./tv-shows.js?v=1"></script>

    <script>
        var lampa_url = '';
        var cache_version = Math.floor((new Date()).getTime() / 9e5);

        function urlJoin(base, add) {
            if (base.charAt(base.length - 1) !== '/') base += '/';
            return base + add;
        }

        function putScript(src, onload, onerror){
            var trys = 0;
            function createScript(){
                var script = document.createElement('script');
                script.type = 'text/javascript';
                script.onload = function(){ if (onload) onload(); };
                script.onerror = function(){
                    trys++;
                    if (trys < 3) return createScript();
                    if (onerror) onerror();
                    else {
                        $('.no-network').removeClass('hide');
                        $('.no-network__file').text(window.location.href + '/' + src);
                    }
                };
                script.src = src;
                document.body.appendChild(script);
            }
            createScript();
        }

        function loadCurrentLampa(){
            putScript('app.min.js?v=' + cache_version, function() {
                initTvShows();
            });
        }

        function loadLocalLampa(){
            if (lampa_url !== '') window.local_lampa = true;
            loadCurrentLampa();
        }

        function renderTvShows(config) {
            var panel = document.getElementById('tv-shows-panel');
            var grid = document.getElementById('tv-shows-grid');
            if (!panel || !grid) return;

            grid.innerHTML = '';
            var channels = (config && config.channels) || [];
            var enabled = channels.filter(function(channel){ return channel && channel.enabled !== false; });

            if (!enabled.length) {
                grid.innerHTML = '<div class="tv-show-empty">Каналы пока не настроены.</div>';
                return;
            }

            enabled.forEach(function(channel){
                var card = document.createElement('div');
                card.className = 'tv-show-card';
                card.tabIndex = 0;
                card.innerHTML = '<div class="tv-show-card__name"></div><div class="tv-show-card__status">Торрент / TorrServer</div>';
                card.querySelector('.tv-show-card__name').textContent = channel.name || channel.id;
                card.addEventListener('click', function(){
                    // Здесь намеренно нет захардкоженной торрент-ссылки.
                    // Выпуск должен быть добавлен источником Lampa/TorrServer.
                    if (window.lampa && window.lampa.Modal && window.lampa.Modal.open) {
                        window.lampa.Modal.open({ title: channel.name, text: 'Выберите выпуск в источнике TorrServer/торрентов Lampa.' });
                    }
                });
                grid.appendChild(card);
            });
        }

        function openTvShows(){
            var panel = document.getElementById('tv-shows-panel');
            if (!panel) return;
            panel.classList.add('is-visible');
            panel.setAttribute('aria-hidden', 'false');
            fetch('tv-shows.json?v=' + cache_version)
                .then(function(response){ return response.json(); })
                .then(renderTvShows)
                .catch(function(){ renderTvShows({ channels: [] }); });
        }

        function closeTvShows(){
            var panel = document.getElementById('tv-shows-panel');
            if (!panel) return;
            panel.classList.remove('is-visible');
            panel.setAttribute('aria-hidden', 'true');
        }

        function initTvShows(){
            var close = document.getElementById('tv-shows-close');
            if (close) close.addEventListener('click', closeTvShows);

            window.HolaSelfTV = {
                open: openTvShows,
                close: closeTvShows
            };

            // Клавиша T открывает раздел во время разработки/на ПК.
            document.addEventListener('keydown', function(event){
                if ((event.key || '').toLowerCase() === 't' && !event.ctrlKey && !event.altKey && !event.metaKey) openTvShows();
                if (event.key === 'Escape') closeTvShows();
            });
        }

        if (typeof AndroidJS !== 'undefined'
            && !!AndroidJS.getLampaURL
            && /^https?:\/\//i.test(AndroidJS.getLampaURL())
            && !/^https?:\/\//i.test(location.href)
        ) {
            lampa_url = urlJoin(AndroidJS.getLampaURL(),'');
        }

        if (lampa_url !== '') {
            putScript(
                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                false,
                function(){}
            );
            putScript(
                urlJoin(lampa_url, 'app.min.js?v=' + cache_version),
                function () {
                    var css = urlJoin(lampa_url, 'css/app.css?v=' + cache_version);
                    $('head').append('<link rel="stylesheet" href="' + css + '">');
                    initTvShows();
                },
                function () {
                    putScript(
                        urlJoin(lampa_url, 'lampa-main/app.min.js?v=' + cache_version),
                        function () {
                            var css = urlJoin(lampa_url, 'lampa-main/css/app.css?v=' + cache_version);
                            $('head').append('<link rel="stylesheet" href="' + css + '">');
                            putScript(urlJoin(lampa_url, 'lampainit.js?v=' + cache_version), false, function(){});
                            initTvShows();
                        },
                        loadLocalLampa
                    );
                }
            );
        } else {
            loadCurrentLampa();
        }
    </script>
</body>
</html>
